<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3aa8e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zettel-Job">
  <title>Zettel-Job</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Kopfzeile -->
    <header class="topbar">
      <button class="icon-btn" id="btn-back" onclick="closeEditor()" aria-label="Zurück" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="brand" id="topbar-title">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
        </span>
        <span class="brand-text">Zettel-Job</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-print" onclick="printActiveSheet()" aria-label="Drucken / PDF" hidden>
          <svg viewBox="0 0 24 24"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
        </button>
        <button class="icon-btn" id="btn-sheet-menu" onclick="openSheetMenu()" aria-label="Mehr" hidden>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
        </button>
        <button class="icon-btn" id="btn-theme" onclick="toggleTheme()" aria-label="Hell/Dunkel umschalten">
          <svg class="ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- Ansicht: Zettel-Liste -->
      <section class="view active" id="view-sheets">
        <div class="balance-strip" id="sheets-balance" onclick="showView('hours')"></div>
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input type="search" id="sheet-search" placeholder="Suchen: Auftrag, Kunde, Schiff …" oninput="renderSheetList()">
          </div>
          <div class="chips" id="sheet-filter">
            <button class="chip active" data-filter="all" onclick="setSheetFilter('all')">Alle</button>
            <button class="chip" data-filter="montage" onclick="setSheetFilter('montage')">Montage</button>
            <button class="chip" data-filter="werkstatt" onclick="setSheetFilter('werkstatt')">Werkstatt</button>
          </div>
        </div>
        <div id="sheet-list" class="sheet-list"></div>
        <button class="fab" onclick="openNewSheetModal()" aria-label="Neuer Zettel">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>Neuer Zettel</span>
        </button>
      </section>

      <!-- Ansicht: Zettel bearbeiten -->
      <section class="view" id="view-editor">
        <div id="editor-body"></div>
      </section>

      <!-- Ansicht: Stunden & Überstunden -->
      <section class="view" id="view-hours">
        <div id="hours-body"></div>
      </section>

      <!-- Ansicht: Einstellungen -->
      <section class="view" id="view-settings">
        <div id="settings-body"></div>
      </section>
    </main>

    <!-- Untere Navigation -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-view="sheets" onclick="showView('sheets')">
        <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
        <span>Zettel</span>
      </button>
      <button class="nav-item" data-view="hours" onclick="showView('hours')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Stunden</span>
      </button>
      <button class="nav-item" data-view="settings" onclick="showView('settings')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Einstellungen</span>
      </button>
    </nav>
  </div>

  <!-- Modal-Container (Inhalt wird per JS gesetzt) -->
  <div class="modal-backdrop" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- Unterschrift -->
  <div class="sign-overlay" id="sign-overlay">
    <div class="sign-head">
      <div>
        <div class="sign-title" id="sign-title">Unterschrift</div>
        <div class="sign-hint">Bitte im Feld unterschreiben – Handy quer halten gibt mehr Platz.</div>
      </div>
      <button class="icon-btn" onclick="closeSignaturePad()" aria-label="Schließen">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sign-name" id="sign-name-wrap">
      <input type="text" id="sign-name" placeholder="Name in Druckbuchstaben" autocomplete="off">
    </div>
    <div class="sign-canvas-wrap">
      <canvas id="sign-canvas"></canvas>
      <div class="sign-line"></div>
    </div>
    <div class="sign-actions">
      <button class="btn btn-ghost" onclick="clearSignaturePad()">Löschen</button>
      <button class="btn btn-primary" onclick="confirmSignaturePad()">Unterschrift übernehmen</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Druckansicht (nur beim Drucken sichtbar) -->
  <div id="print-area"></div>

  <script src="js/01-core.js"></script>
  <script src="js/02-helpers.js"></script>
  <script src="js/03-sheets.js"></script>
  <script src="js/04-editor.js"></script>
  <script src="js/05-signature.js"></script>
  <script src="js/06-print.js"></script>
  <script src="js/07-hours.js"></script>
  <script src="js/08-settings.js"></script>
</body>
</html>
